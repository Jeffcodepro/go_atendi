version: "3.9"

services:
  goatendi_site:
    image: ${APP_IMAGE}
    command:
      - sh
      - -lc
      - |
        rm -f tmp/pids/server.pid
        until pg_isready -h goatendi_site_db -p 5432 -U go_atendi -d go_atendi_production >/dev/null 2>&1; do
          echo "waiting for go_atendi database..."
          sleep 2
        done
        bundle exec rails db:prepare
        exec ./bin/rails server -b 0.0.0.0 -p 3000
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      PORT: "3000"
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      FORCE_SSL: "true"
      PGHOST: "goatendi_site_db"
      PGPORT: "5432"
      PGUSER: "go_atendi"
      PGDATABASE: "go_atendi_production"
      PGPASSWORD: ${GO_ATENDI_DATABASE_PASSWORD}
      GO_ATENDI_DATABASE_PASSWORD: ${GO_ATENDI_DATABASE_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DEPLOY_NONCE: ${DEPLOY_NONCE}
    volumes:
      - go_atendi_storage:/rails/storage
    networks:
      - app_net
      - traefik_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=SollucionNet
        - traefik.http.routers.goatendi_site.rule=Host(`goatendi.com`)
        - traefik.http.routers.goatendi_site.entrypoints=websecure
        - traefik.http.routers.goatendi_site.tls.certresolver=letsencryptresolver
        - traefik.http.routers.goatendi_site.service=goatendi_site
        - traefik.http.routers.goatendi_site.middlewares=goatendi_site_sslheader
        - traefik.http.middlewares.goatendi_site_sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.services.goatendi_site.loadbalancer.server.port=3000
        - traefik.http.services.goatendi_site.loadbalancer.passHostHeader=true

  goatendi_site_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: go_atendi_production
      POSTGRES_USER: go_atendi
      POSTGRES_PASSWORD: ${GO_ATENDI_DATABASE_PASSWORD}
    volumes:
      - go_atendi_postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_atendi -d go_atendi_production"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  go_atendi_postgres_data:
  go_atendi_storage:

networks:
  app_net:
  traefik_net:
    external: true
    name: SollucionNet
