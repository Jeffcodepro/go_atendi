version: "3.7"

services:
  go_atendi:
    image: go_atendi:latest

    networks:
      - network_swarm_public

    environment:
      RAILS_ENV: production
      RACK_ENV: production

      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"

      # Banco de dados PostgreSQL
      # Exemplo:
      # postgres://usuario:senha@IP_DO_BANCO:5432/go_atendi_production
      DATABASE_URL: "postgres://USUARIO:SENHA@HOST_DO_BANCO:5432/NOME_DO_BANCO"

      # Use a chave do config/master.key do projeto
      RAILS_MASTER_KEY: "cfe82908ee3ea6c04641d702dbfda578"

      # Gere uma secret forte com:
      # openssl rand -hex 64
      SECRET_KEY_BASE: "796847c296897f5b507c93a9307ea8961cbae9ea1a3de54348ed75e09af7e7498f3e0cb6d787492a5666f1f53c87a4258264df29ba368fa826ca50be9409a46e"

      # Caso use Google OAuth depois
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""

      # Caso use SMTP depois
      SMTP_ADDRESS: ""
      SMTP_PORT: "587"
      SMTP_DOMAIN: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_AUTHENTICATION: "plain"
      SMTP_ENABLE_STARTTLS_AUTO: "true"

      # Controla se o container deve rodar db:prepare ao iniciar
      RUN_DB_PREPARE: "true"

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      labels:
        - "traefik.enable=true"

        # Router HTTPS
        - "traefik.http.routers.go_atendi.rule=Host(`goatendi.seudominio.com.br`)"
        - "traefik.http.routers.go_atendi.entrypoints=websecure"
        - "traefik.http.routers.go_atendi.tls=true"
        - "traefik.http.routers.go_atendi.tls.certresolver=letsencryptresolver"

        # Service interno Rails
        - "traefik.http.services.go_atendi.loadbalancer.server.port=3000"

        # Rede usada pelo Traefik
        - "traefik.docker.network=network_swarm_public"

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
